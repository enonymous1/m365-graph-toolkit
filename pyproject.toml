[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m365-graph-toolkit"
version = "2.0.0"
description = "Export and analyse Microsoft 365 data via the Microsoft Graph API: users, groups, SharePoint, OneDrive, and audit logs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "enonymous1" }]
keywords = ["microsoft-graph", "m365", "entra-id", "sharepoint", "onedrive", "audit-logs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
graph = [
    "azure-identity>=1.17",
    "msgraph-sdk>=1.30,<2",
    "msgraph-core>=1.3,<2",
]
dev = [
    "m365-graph-toolkit[graph]",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
m365-toolkit = "m365_graph_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/enonymous1/m365-graph-toolkit"
Repository = "https://github.com/enonymous1/m365-graph-toolkit"
Issues = "https://github.com/enonymous1/m365-graph-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/m365_graph_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
